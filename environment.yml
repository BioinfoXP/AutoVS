# AutoVS 运行环境（混合安装：conda 只装 pip 装不了的 CLI 二进制，其余走 pip）
# 全新安装（在仓库根目录执行）：
#   conda env create -f environment.yml   # 生成环境 autovs
#   conda activate autovs && autovs doctor
# 说明：纯 Python 依赖（rdkit/meeko/openmm/pdbfixer/pymol 等）由 pyproject.toml
#       经 pip 安装；GROMACS 仅 MD 阶段需要，批量对接无需安装。
name: autovs
channels:
  - conda-forge
dependencies:
  - python=3.11
  - vina>=1.2.5              # 对接引擎 CLI+绑定（conda-forge；bioconda 的 autodock-vina 已只剩 1.1.2 勿用）
  - openbabel>=3.1           # 格式转换 CLI（可选）
  - fpocket                  # 口袋检测 CLI（可选，动态口袋用）
  - pymol-open-source        # 3D 渲染（PyPI 无 Linux 轮子；缺失时 visualize 自动跳过 3D 只出 2D）
  - pip
  - pip:
    - -e ".[dev,mcp]"        # 本体 + 受体修复/渲染依赖 + pytest + mcp
